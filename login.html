<!-- ==========================================================================
     OCA HOLDING GROUP LLC — PORTAL DE CLIENTES: INICIO DE SESIÓN
     Autenticación vía Supabase Auth (ver assets/js/supabase-config.js para
     la URL/anon key del proyecto). No requiere backend propio: supabase-js
     habla directamente con Supabase, protegido por Row Level Security
     (ver backend/schema.sql). Tras iniciar sesión, redirige a dashboard.html.
     ========================================================================== -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Clientes | OCA Holding Group LLC</title>
<meta name="description" content="Inicia sesión en el portal de clientes de OCA Holding Group LLC para ver el estado de tu proyecto y tus facturas.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.ocaholdinggroup.com/login.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" type="image/svg+xml" href="assets/img/logo-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: "#0B1F3A", light: "#142C52" },
          graphite: "#2E2E33",
          gold: { DEFAULT: "#B8963E", light: "#D9C088" },
          paper: "#F7F5F1"
        },
        fontFamily: {
          sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          serif: ["Playfair Display", "ui-serif", "Georgia", "serif"]
        }
      }
    }
  };
</script>

<!-- Cliente de Supabase (Auth + Postgres vía RLS) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

</head>

<body data-page="login" class="bg-paper text-graphite font-sans antialiased">

  <!-- ============ HEADER ============ -->
  <header id="site-header" class="sticky top-0 z-40 bg-paper/95 backdrop-blur border-b border-slate-200">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-20 items-center justify-between">
        <a href="index.html" class="flex items-center gap-2.5">
          <img src="assets/img/logo-icon.svg" alt="OCA Holding Group LLC" class="h-10 w-10">
          <span class="font-serif text-lg font-semibold text-navy tracking-tight">OCA <span class="text-gold">Holding</span> Group</span>
        </a>
        <nav class="hidden lg:flex items-center gap-8">
          <a href="index.html" data-nav-key="home" data-i18n="nav.home" class="nav-link text-sm font-medium text-graphite hover:text-navy transition-colors"></a>
          <a href="nosotros.html" data-nav-key="about" data-i18n="nav.about" class="nav-link text-sm font-medium text-graphite hover:text-navy transition-colors"></a>
          <a href="portafolio.html" data-nav-key="portfolio" data-i18n="nav.portfolio" class="nav-link text-sm font-medium text-graphite hover:text-navy transition-colors"></a>
          <a href="noticias.html" data-nav-key="news" data-i18n="nav.news" class="nav-link text-sm font-medium text-graphite hover:text-navy transition-colors"></a>
          <a href="contacto.html" data-nav-key="contact" data-i18n="nav.contact" class="nav-link text-sm font-medium text-graphite hover:text-navy transition-colors"></a>
        </nav>
        <div class="hidden lg:flex items-center gap-4">
          <button type="button" data-lang-toggle class="flex items-center gap-1.5 rounded-full border border-slate-300 px-3 py-1.5 text-xs font-semibold text-navy hover:border-gold hover:text-gold transition-colors">
            <span data-lang-toggle-label></span>
          </button>
          <a href="contacto.html" data-i18n="nav.investors" class="rounded-full bg-navy px-5 py-2.5 text-sm font-semibold text-white hover:bg-navy-light transition-colors"></a>
        </div>
        <button id="menu-toggle" type="button" aria-expanded="false" aria-label="Abrir menú" class="lg:hidden flex items-center justify-center rounded-md p-2 text-navy">
          <svg data-icon-open xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg data-icon-close class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="mobile-menu" class="lg:hidden">
        <nav class="flex flex-col gap-1 pb-6 pt-2 border-t border-slate-200">
          <a href="index.html" data-nav-key="home" data-i18n="nav.home" class="rounded-md px-3 py-2.5 text-sm font-medium text-graphite hover:bg-white"></a>
          <a href="nosotros.html" data-nav-key="about" data-i18n="nav.about" class="rounded-md px-3 py-2.5 text-sm font-medium text-graphite hover:bg-white"></a>
          <a href="portafolio.html" data-nav-key="portfolio" data-i18n="nav.portfolio" class="rounded-md px-3 py-2.5 text-sm font-medium text-graphite hover:bg-white"></a>
          <a href="noticias.html" data-nav-key="news" data-i18n="nav.news" class="rounded-md px-3 py-2.5 text-sm font-medium text-graphite hover:bg-white"></a>
          <a href="contacto.html" data-nav-key="contact" data-i18n="nav.contact" class="rounded-md px-3 py-2.5 text-sm font-medium text-graphite hover:bg-white"></a>
          <button type="button" data-lang-toggle class="mt-2 mx-3 flex items-center justify-center gap-1.5 rounded-full border border-slate-300 px-3 py-2 text-xs font-semibold text-navy">
            <span data-lang-toggle-label></span>
          </button>
        </nav>
      </div>
    </div>
  </header>
  <!-- ============ /HEADER ============ -->

  <main>
    <section class="bg-navy py-20">
      <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 text-center">
        <span data-i18n="login.heroEyebrow" class="inline-block rounded-full border border-gold/40 px-4 py-1.5 text-xs font-semibold uppercase tracking-widest text-gold-light mb-6"></span>
        <h1 data-i18n="login.heroTitle" class="font-serif text-3xl sm:text-4xl font-semibold leading-tight text-white mb-4"></h1>
        <p data-i18n="login.heroText" class="text-base text-slate-300 leading-relaxed max-w-xl mx-auto"></p>
      </div>
    </section>

    <section class="py-20">
      <div class="mx-auto max-w-md px-4 sm:px-6 lg:px-8">

        <!-- Aviso si assets/js/supabase-config.js sigue con valores placeholder -->
        <div id="config-warning" class="hidden rounded-lg border border-amber-300 bg-amber-50 p-5 text-sm text-amber-800 mb-6">
          <span data-i18n="login.errorConfigMissing"></span>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-8 sm:p-10">
          <!-- Tabs -->
          <div class="flex rounded-full bg-paper p-1 mb-8">
            <button type="button" data-tab="signin" data-i18n="login.tabSignIn" class="flex-1 rounded-full px-4 py-2 text-sm font-semibold transition-colors"></button>
            <button type="button" data-tab="signup" data-i18n="login.tabSignUp" class="flex-1 rounded-full px-4 py-2 text-sm font-semibold transition-colors"></button>
          </div>

          <div id="form-message" class="hidden rounded-lg p-4 text-sm mb-6"></div>

          <!-- FORMULARIO: INICIAR SESIÓN -->
          <form id="signin-form" class="space-y-5">
            <div data-field>
              <label for="signin-email" data-i18n="login.labelEmail" class="block text-sm font-medium text-navy mb-1.5"></label>
              <input type="email" id="signin-email" name="email" required data-i18n-placeholder="login.placeholderEmail" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
            </div>
            <div data-field>
              <label for="signin-password" data-i18n="login.labelPassword" class="block text-sm font-medium text-navy mb-1.5"></label>
              <input type="password" id="signin-password" name="password" required minlength="6" data-i18n-placeholder="login.placeholderPassword" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
            </div>
            <button type="submit" data-submit-button data-i18n="login.submitSignIn" class="w-full inline-flex items-center justify-center rounded-full bg-navy px-8 py-3.5 text-sm font-semibold text-white hover:bg-navy-light transition-colors"></button>
            <button type="button" id="forgot-password-link" data-i18n="login.forgotPassword" class="block w-full text-center text-xs font-medium text-slate-500 hover:text-navy transition-colors"></button>
          </form>

          <!-- FORMULARIO: CREAR CUENTA -->
          <form id="signup-form" class="space-y-5 hidden">
            <div data-field>
              <label for="signup-name" data-i18n="login.labelFullName" class="block text-sm font-medium text-navy mb-1.5"></label>
              <input type="text" id="signup-name" name="fullName" required minlength="2" data-i18n-placeholder="login.placeholderFullName" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
            </div>
            <div data-field>
              <label for="signup-company" data-i18n="login.labelCompany" class="block text-sm font-medium text-navy mb-1.5"></label>
              <input type="text" id="signup-company" name="company" data-i18n-placeholder="login.placeholderCompany" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
            </div>
            <div data-field>
              <label for="signup-email" data-i18n="login.labelEmail" class="block text-sm font-medium text-navy mb-1.5"></label>
              <input type="email" id="signup-email" name="email" required data-i18n-placeholder="login.placeholderEmail" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
            </div>
            <div data-field>
              <label for="signup-password" data-i18n="login.labelPassword" class="block text-sm font-medium text-navy mb-1.5"></label>
              <input type="password" id="signup-password" name="password" required minlength="6" data-i18n-placeholder="login.placeholderPassword" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
            </div>
            <button type="submit" data-submit-button data-i18n="login.submitSignUp" class="w-full inline-flex items-center justify-center rounded-full bg-navy px-8 py-3.5 text-sm font-semibold text-white hover:bg-navy-light transition-colors"></button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="bg-navy text-white">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-16">

        <div class="md:col-span-2">
          <div class="flex items-center gap-2 mb-4">
            <img src="assets/img/logo-icon.svg" alt="OCA Holding Group LLC" class="h-10 w-10">
            <span class="font-serif text-lg font-semibold">OCA <span class="text-gold-light">Holding</span> Group</span>
          </div>
          <p data-i18n="footer.tagline" class="text-sm text-slate-300 max-w-sm leading-relaxed"></p>
        </div>
        <div>
          <h4 data-i18n="footer.quickLinksTitle" class="text-sm font-semibold uppercase tracking-wide text-gold-light mb-4"></h4>
          <ul class="space-y-2 text-sm text-slate-300">
            <li><a href="index.html" data-i18n="nav.home" class="hover:text-white"></a></li>
            <li><a href="nosotros.html" data-i18n="nav.about" class="hover:text-white"></a></li>
            <li><a href="portafolio.html" data-i18n="nav.portfolio" class="hover:text-white"></a></li>
            <li><a href="noticias.html" data-i18n="nav.news" class="hover:text-white"></a></li>
            <li><a href="contacto.html" data-i18n="nav.contact" class="hover:text-white"></a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.legalTitle" class="text-sm font-semibold uppercase tracking-wide text-gold-light mb-4"></h4>
          <ul class="space-y-2 text-sm text-slate-300">
            <li><a href="terminos.html" data-i18n="footer.termsLink" class="hover:text-white"></a></li>
            <li><a href="privacidad.html" data-i18n="footer.privacyLink" class="hover:text-white"></a></li>
          </ul>
          <h4 data-i18n="footer.contactTitle" class="text-sm font-semibold uppercase tracking-wide text-gold-light mt-6 mb-2"></h4>
          <p class="text-sm text-slate-300">info@ocaholdinggroup.com</p>
        </div>
      </div>
      <div class="mt-12 border-t border-white/10 pt-8">
        <p data-i18n="footer.registeredNote" class="text-xs text-slate-400 leading-relaxed max-w-4xl"></p>
        <p class="mt-4 text-xs text-slate-400">&copy; <span data-current-year></span> OCA Holding Group LLC. <span data-i18n="footer.rightsReserved"></span></p>
      </div>
    </div>
  </footer>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
