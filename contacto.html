  <main>
    <!-- HERO -->
    <section class="bg-navy py-24">
      <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 text-center">
        <span data-i18n="contact.heroEyebrow" class="inline-block rounded-full border border-gold/40 px-4 py-1.5 text-xs font-semibold uppercase tracking-widest text-gold-light mb-6"></span>
        <h1 data-i18n="contact.heroTitle" class="font-serif text-3xl sm:text-4xl lg:text-5xl font-semibold leading-tight text-white mb-6"></h1>
        <p data-i18n="contact.heroText" class="text-lg text-slate-300 leading-relaxed max-w-2xl mx-auto"></p>
      </div>
    </section>

    <!-- FORMULARIO + SEDE -->
    <section class="py-20">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 grid grid-cols-1 gap-12 lg:grid-cols-5">

        <!-- FORMULARIO -->
        <div class="lg:col-span-3 rounded-xl border border-slate-200 bg-white p-8 sm:p-10" data-reveal>
          <h2 data-i18n="contact.formTitle" class="font-serif text-2xl font-semibold text-navy mb-2"></h2>
          <p data-i18n="contact.formSubtitle" class="text-sm text-slate-500 mb-8"></p>

          <!-- Mensaje de éxito (oculto por defecto, mostrado por main.js tras envío) -->
          <div id="form-success" class="hidden rounded-lg bg-green-50 border border-green-200 p-6 text-center">
            <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-green-100 text-green-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h3 data-i18n="contact.successTitle" class="font-serif text-lg font-semibold text-green-800 mb-1"></h3>
            <p data-i18n="contact.successText" class="text-sm text-green-700"></p>
          </div>

          <!-- CMS/Backend: action/method quedan de referencia; el envío real
               lo maneja JS (fetch) en main.js -> initContactForm() -->
          <form id="contact-form" novalidate class="space-y-6">

            <div data-field>
              <label for="department" data-i18n="contact.labelDepartment" class="block text-sm font-medium text-navy mb-1.5"></label>
              <select id="department" name="department" required class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
                <option value="general" data-i18n="contact.deptGeneral"></option>
                <option value="investments" data-i18n="contact.deptInvestments"></option>
                <option value="press" data-i18n="contact.deptPress"></option>
                <option value="partnerships" data-i18n="contact.deptPartnerships"></option>
                <option value="quote" data-i18n="contact.deptQuote"></option>
              </select>
            </div>

            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
              <div data-field>
                <label for="fullName" data-i18n="contact.labelFullName" class="block text-sm font-medium text-navy mb-1.5"></label>
                <input type="text" id="fullName" name="fullName" required minlength="2" data-i18n-placeholder="contact.placeholderFullName" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
                <p class="field-error-message mt-1.5 text-xs text-red-600" data-i18n="contact.errorRequired"></p>
              </div>
              <div data-field>
                <label for="email" data-i18n="contact.labelEmail" class="block text-sm font-medium text-navy mb-1.5"></label>
                <input type="email" id="email" name="email" required data-i18n-placeholder="contact.placeholderEmail" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
                <p class="field-error-message mt-1.5 text-xs text-red-600" data-i18n="contact.errorEmail"></p>
              </div>
            </div>

            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
              <div data-field>
                <label for="company" data-i18n="contact.labelCompany" class="block text-sm font-medium text-navy mb-1.5"></label>
                <input type="text" id="company" name="company" data-i18n-placeholder="contact.placeholderCompany" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
              </div>
              <div data-field>
                <label for="phone" data-i18n="contact.labelPhone" class="block text-sm font-medium text-navy mb-1.5"></label>
                <input type="tel" id="phone" name="phone" data-i18n-placeholder="contact.placeholderPhone" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
              </div>
            </div>

            <!-- Brief de proyecto: oculto por defecto, se revela cuando el
                 departamento seleccionado es "quote" (ver main.js -> toggleQuoteFields) -->
            <div id="quote-fields" hidden class="space-y-6 rounded-lg border border-gold/30 bg-paper/70 p-6">
              <div>
                <h3 data-i18n="contact.quoteSectionTitle" class="font-serif text-base font-semibold text-navy mb-1"></h3>
                <p data-i18n="contact.quoteSectionSubtitle" class="text-xs text-slate-500"></p>
              </div>

              <div data-field>
                <label for="projectType" data-i18n="contact.labelProjectType" class="block text-sm font-medium text-navy mb-1.5"></label>
                <select id="projectType" name="projectType" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
                  <option value="website" data-i18n="contact.projectTypeWebsite"></option>
                  <option value="webapp" data-i18n="contact.projectTypeWebApp"></option>
                  <option value="mobileapp" data-i18n="contact.projectTypeMobileApp"></option>
                  <option value="ecommerce" data-i18n="contact.projectTypeEcommerce"></option>
                  <option value="software" data-i18n="contact.projectTypeSoftware"></option>
                  <option value="branding" data-i18n="contact.projectTypeBranding"></option>
                  <option value="other" data-i18n="contact.projectTypeOther"></option>
                </select>
              </div>

              <div data-field>
                <label for="projectDescription" data-i18n="contact.labelProjectDescription" class="block text-sm font-medium text-navy mb-1.5"></label>
                <textarea id="projectDescription" name="projectDescription" rows="4" minlength="20" data-i18n-placeholder="contact.placeholderProjectDescription" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none"></textarea>
                <p class="field-error-message mt-1.5 text-xs text-red-600" data-i18n="contact.errorRequired"></p>
              </div>

              <div data-field>
                <label for="keyFeatures" data-i18n="contact.labelKeyFeatures" class="block text-sm font-medium text-navy mb-1.5"></label>
                <textarea id="keyFeatures" name="keyFeatures" rows="3" data-i18n-placeholder="contact.placeholderKeyFeatures" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none"></textarea>
              </div>

              <div data-field>
                <label for="targetAudience" data-i18n="contact.labelTargetAudience" class="block text-sm font-medium text-navy mb-1.5"></label>
                <input type="text" id="targetAudience" name="targetAudience" data-i18n-placeholder="contact.placeholderTargetAudience" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
              </div>

              <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                <div data-field>
                  <label for="budget" data-i18n="contact.labelBudget" class="block text-sm font-medium text-navy mb-1.5"></label>
                  <select id="budget" name="budget" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
                    <option value="under5k" data-i18n="contact.budgetUnder5k"></option>
                    <option value="5to15k" data-i18n="contact.budget5to15k"></option>
                    <option value="15to50k" data-i18n="contact.budget15to50k"></option>
                    <option value="over50k" data-i18n="contact.budgetOver50k"></option>
                    <option value="tbd" selected data-i18n="contact.budgetTbd"></option>
                  </select>
                </div>
                <div data-field>
                  <label for="timeline" data-i18n="contact.labelTimeline" class="block text-sm font-medium text-navy mb-1.5"></label>
                  <select id="timeline" name="timeline" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
                    <option value="urgent" data-i18n="contact.timelineUrgent"></option>
                    <option value="1to3" data-i18n="contact.timeline1to3"></option>
                    <option value="3to6" data-i18n="contact.timeline3to6"></option>
                    <option value="flexible" selected data-i18n="contact.timelineFlexible"></option>
                  </select>
                </div>
              </div>

              <div data-field>
                <label for="hasExistingBrand" data-i18n="contact.labelHasExistingBrand" class="block text-sm font-medium text-navy mb-1.5"></label>
                <select id="hasExistingBrand" name="hasExistingBrand" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
                  <option value="yes" data-i18n="contact.hasExistingBrandYes"></option>
                  <option value="no" data-i18n="contact.hasExistingBrandNo"></option>
                  <option value="partial" data-i18n="contact.hasExistingBrandPartial"></option>
                </select>
              </div>

              <div data-field>
                <label for="references" data-i18n="contact.labelReferences" class="block text-sm font-medium text-navy mb-1.5"></label>
                <input type="text" id="references" name="references" data-i18n-placeholder="contact.placeholderReferences" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none">
              </div>
            </div>

            <div data-field>
              <label for="message" data-i18n="contact.labelMessage" class="block text-sm font-medium text-navy mb-1.5"></label>
              <textarea id="message" name="message" rows="5" required minlength="10" data-i18n-placeholder="contact.placeholderMessage" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-graphite focus:border-gold focus:ring-1 focus:ring-gold outline-none"></textarea>
              <p class="field-error-message mt-1.5 text-xs text-red-600" data-i18n="contact.errorRequired"></p>
            </div>

            <button type="submit" data-submit-button data-i18n="contact.submitButton" class="w-full sm:w-auto inline-flex items-center justify-center rounded-full bg-navy px-8 py-3.5 text-sm font-semibold text-white hover:bg-navy-light transition-colors"></button>
          </form>
        </div>

        <!-- SEDE / OFICINAS -->
        <div class="lg:col-span-2 space-y-8">
          <div class="rounded-xl border border-slate-200 bg-white p-8" data-reveal>
            <span data-i18n="contact.hqEyebrow" class="text-xs font-semibold uppercase tracking-widest text-gold"></span>
            <h3 data-i18n="contact.hqTitle" class="mt-2 font-serif text-lg font-semibold text-navy mb-4"></h3>
            <ul class="space-y-3 text-sm text-slate-600">
              <li class="flex items-start gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
                <span data-i18n="contact.hqAddress"></span>
              </li>
              <li class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h1.5a1.5 1.5 0 001.5-1.5v-2.25a1.5 1.5 0 00-1.5-1.5h-2.25a1.5 1.5 0 00-1.5 1.5v.75c-3.75-.75-6.75-3.75-7.5-7.5h.75a1.5 1.5 0 001.5-1.5V6.75a1.5 1.5 0 00-1.5-1.5H3.75a1.5 1.5 0 00-1.5 1.5z"/></svg>
                <span data-i18n="contact.hqPhone"></span>
              </li>
              <li class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
                <span data-i18n="contact.hqEmail"></span>
              </li>
            </ul>
          </div>

          <div class="rounded-xl border border-slate-200 bg-white p-8" data-reveal>
            <span data-i18n="contact.subsidiariesEyebrow" class="text-xs font-semibold uppercase tracking-widest text-gold"></span>
            <h3 data-i18n="contact.subsidiariesTitle" class="mt-2 font-serif text-lg font-semibold text-navy mb-4"></h3>
            <!-- CMS: reemplazar por listado dinámico de oficinas regionales -->
            <ul class="space-y-3 text-sm text-slate-600">
              <li class="flex items-center justify-between border-b border-slate-100 pb-3">
                <span>Ciudad de México, México</span>
                <span class="text-xs text-slate-400">LATAM HQ</span>
              </li>
              <li class="flex items-center justify-between border-b border-slate-100 pb-3">
                <span>Madrid, España</span>
                <span class="text-xs text-slate-400">EMEA HQ</span>
              </li>
              <li class="flex items-center justify-between">
                <span>Miami, FL, Estados Unidos</span>
                <span class="text-xs text-slate-400">Regional Office</span>
